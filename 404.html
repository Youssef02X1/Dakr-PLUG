<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Dakar PLUG</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">

<body>
<nav class="navbar scrolled">
  <div class="container navbar-inner">
    <a href="index.html" class="nav-logo"><span>Dakar</span>PLUG</a>

<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--nav-h) 20px 40px">
  <div style="text-align:center;max-width:480px">

    <div style="font-family:var(--font-display);font-size:clamp(6rem,18vw,10rem);font-weight:300;
                color:var(--paper-3);letter-spacing:-.04em;line-height:1;margin-bottom:8px">
      404
    </div>

    <h1 style="font-family:var(--font-display);font-size:clamp(1.4rem,3vw,1.9rem);font-weight:300;
               letter-spacing:-.02em;color:var(--ink);margin-bottom:12px">
      Page introuvable
    </h1>

    <p style="font-size:15px;color:var(--ink-3);line-height:1.7;margin-bottom:32px">
      Cette page n'existe pas ou a été déplacée.<br>
      Retrouvez toutes nos activités sur la page d'accueil.
    </p>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">

      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <a href="index.html?cat=kayak"      class="tag">Kayak</a>
        <a href="index.html?cat=jetski"     class="tag">Jet ski</a>
        <a href="index.html?cat=quad"       class="tag">Quad</a>
        <a href="index.html?cat=plage"      class="tag">Plage</a>
        <a href="index.html?cat=restaurant" class="tag">Restaurant</a>
      </div>
    </div>

  </div>

<footer style="background:var(--ink);padding:20px 0">
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <a href="index.html" class="nav-logo" style="color:#fff"><span style="color:var(--accent)">Dakar</span>PLUG</a>
    <span style="font-size:12px;color:rgba(255,255,255,.3)">© 2026 Dakar PLUG</span>
  </div>
